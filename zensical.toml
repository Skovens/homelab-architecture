      { "Model Proxy" = "workloads/ai-stack/model-proxy.md" },
      { "Open WebUI" = "workloads/ai-stack/open-webui.md" },
      { "Document Processing" = "workloads/ai-stack/document-processing.md" },
      { "MCP Servers" = "workloads/ai-stack/mcp-servers.md" },
      { "Knowledge Base" = "workloads/ai-stack/knowledge-base.md" },
    ] },
    { "Services" = [
      "workloads/services/index.md",
      { "Forgejo" = "workloads/services/forgejo.md" },
      { "Healthchecks" = "workloads/services/healthchecks.md" },
      { "NFS" = "workloads/services/nfs.md" },
    ] },
  ] },
  { "Foundations" = [
    { "Networking" = [
      "foundations/networking/index.md",
      { "Mesh VPN" = "foundations/networking/mesh-vpn.md" },
      { "Firewalls" = "foundations/networking/firewall-ufw-pf.md" },
      { "Reverse Proxy" = "foundations/networking/reverse-proxy.md" },
    ] },
    { "Storage" = [
      "foundations/storage/index.md",
      { "ZFS Datasets" = "foundations/storage/zfs-datasets.md" },
      { "Snapshots with Sanoid" = "foundations/storage/snapshots-sanoid.md" },
      { "Replication with Syncoid" = "foundations/storage/replication-syncoid.md" },
      { "Cloud Backup" = "foundations/storage/cloud-backup.md" },
    ] },
  ] },
  { "Operations" = [
    { "Infrastructure as Code" = [
      "operations/iac/index.md",
      { "Ansible Patterns" = "operations/iac/ansible-patterns.md" },
      { "Secrets Management" = "operations/iac/secrets-management.md" },
      { "Pre-commit & Linting" = "operations/iac/pre-commit-linting.md" },
    ] },
    { "Backup & DR" = [
      "operations/backup-dr/index.md",
      { "Three-Layer Strategy" = "operations/backup-dr/three-layer-strategy.md" },
      { "DR Host" = "operations/backup-dr/dr-host.md" },
    ] },
  ] },
  { "Decisions" = [
    "decisions/index.md",
    { "ADR-0001: Rootless Users" = "decisions/0001-rootless-per-service-users.md" },
    { "ADR-0002: --machine= Management" = "decisions/0002-user-scoped-systemd-machine.md" },
    { "ADR-0003: AI Services Pod" = "decisions/0003-ai-services-pod.md" },
    { "ADR-0004: Podman Secrets" = "decisions/0004-podman-secrets.md" },
    { "ADR-0005: Timezone Pass-Through" = "decisions/0005-timezone-pass-through.md" },
    { "ADR-0006: Docling Filter" = "decisions/0006-oikb-docling-filter.md" },
    { "ADR-0007: Docling Timeout" = "decisions/0007-docling-sync-timeout.md" },
    { "ADR-0008: NVIDIA R580" = "decisions/0008-nvidia-r580-run-installer.md" },
    { "ADR-0010: Fixed Context Sizes" = "decisions/0010-fixed-context-sizes-replace-fit.md" },
    { "ADR-0011: Egress Gate" = "decisions/0011-egress-gate-for-rootless-containers.md" },
    { "ADR-0012: Podman Rootless" = "decisions/0012-podman-for-rootless-containers.md" },
    { "ADR-0013: Quadlets" = "decisions/0013-quadlets-over-docker-compose.md" },
  ] },
]

[project.theme]
name = "material"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "search.highlight",
]

# Dark mode (default) — Material slate
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Light mode — Material default
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]


